name: Generate profile assets

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card and brand icon tiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate_assets.py

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "Assets already up to date."
          else
            git commit -m "chore: refresh generated profile assets [skip ci]"
            git push
          fi
