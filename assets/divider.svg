<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#22d3ee;#e879f9;#818cf8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="10" fill="url(#dg)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
